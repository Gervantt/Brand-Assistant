name: brand-assistant

# Optional self-hosted Langfuse (profile: observability).
include:
  - infra/langfuse/compose.yml

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql://brand:brand@postgres:5432/brand
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
  MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:-local-dev-only-mcp-secret-change-me}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brand
      POSTGRES_PASSWORD: brand
      POSTGRES_DB: brand
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand -d brand"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: migrations + seed before api and mcp start (both are idempotent).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["sh", "-c", "alembic -c /app/apps/api/alembic.ini upgrade head && python -m brand_api.seed"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      MCP_URL: http://mcp:8001/mcp
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp_server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}  # local profile: cross-encoder on
    volumes:
      - models:/models  # embedding + reranker models survive rebuilds (~1.3 GB on first start)
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  # Optional local LLM: `docker compose --profile ollama up -d`, then
  # `docker compose exec ollama ollama pull qwen3:4b` and set OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  models:
  ollama:
