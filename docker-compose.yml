name: brand-assistant

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql://brand:brand@postgres:5432/brand
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brand
      POSTGRES_PASSWORD: brand
      POSTGRES_DB: brand
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand -d brand"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional local LLM: `docker compose --profile ollama up -d`, then
  # `docker compose exec ollama ollama pull qwen3:4b` and set OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
