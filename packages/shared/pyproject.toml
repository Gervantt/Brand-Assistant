[project]
name = "brand-shared"
version = "0.1.0"
description = "Shared Pydantic schemas and SQLAlchemy models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
